name: Monedes

on:
  push: 
    branches: [ main, development ]

jobs:
  create-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v7

      - name: Configurem python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preparem l'entorn amb els paquets
        run: pip install -r requirements.txt
          
      - name: Correm l'script
        run: python ./euro.py

  usd-exchange:
    if: ${{ github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v7

      - name: Configurem python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preparem l'entorn amb els paquets
        run: pip install -r requirements.txt

      - name: Correm l'script només per a USD
        run: python ./euro.py USD